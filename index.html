<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JobClock" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>JobClock</title>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">FIELD WORK LOG</p>
        <h1>JobClock</h1>
      </div>
      <div class="status-pill" id="statusPill">Ready</div>
    </header>

    <section class="card">
      <div class="section-heading compact">
        <div>
          <p class="eyebrow">CURRENT JOB</p>
          <h2>Job Details</h2>
        </div>
      </div>

      <label class="field">
        <span>Customer Name</span>
        <input id="customerName" type="text" placeholder="Customer name" autocomplete="name" />
      </label>

      <label class="field">
        <span>Phone Number</span>
        <input id="phoneNumber" type="tel" inputmode="tel" placeholder="(555) 555-5555" autocomplete="tel" />
      </label>

      <label class="field">
        <span>Items Used</span>
        <textarea id="itemsUsed" rows="4" placeholder="Parts, materials, quantities, etc."></textarea>
      </label>

      <label class="field">
        <span>Notes</span>
        <textarea id="jobNotes" rows="4" placeholder="Work completed, problems found, follow-up needed, etc."></textarea>
      </label>

      <div id="timePanel" class="time-panel" hidden>
        <div class="time-row">
          <span>Started</span>
          <strong id="startedTime">—</strong>
        </div>
        <div class="time-row">
          <span>Stopped</span>
          <strong id="stoppedTime">Not finished</strong>
        </div>
      </div>

      <div id="activePhotos" class="photo-section" hidden>
        <div class="photo-section-heading">
          <span>Completed Job Photos</span>
          <span id="activePhotoCount">0 photos</span>
        </div>
        <div id="activePhotoStrip" class="photo-strip"></div>
        <label class="secondary-button full-width">
          Add Photos
          <input id="activePhotoInput" type="file" accept="image/*" multiple hidden />
        </label>
      </div>

      <button id="mainButton" class="primary-button" disabled>
        <span id="mainButtonIcon">▶</span>
        <span id="mainButtonText">Start Job</span>
      </button>

      <p class="helper" id="helperText">
        Start and stop times are recorded in Eastern Time.
      </p>
    </section>

    <section class="history-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">COMPLETED WORK</p>
          <h2>Saved Jobs</h2>
        </div>
        <button id="exportAllButton" class="secondary-button small" hidden>Export All PDF</button>
      </div>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✓</div>
        <strong>No completed jobs yet</strong>
        <span>Finished jobs will appear here.</span>
      </div>

      <div id="jobList" class="job-list"></div>
    </section>
  </main>

  <template id="jobTemplate">
    <article class="job-card">
      <div class="job-card-top">
        <div>
          <h3 class="job-title"></h3>
          <p class="job-phone"></p>
          <p class="job-date"></p>
        </div>
        <div class="job-photo-count"></div>
      </div>

      <div class="saved-time-grid">
        <div>
          <span>START</span>
          <strong class="job-start"></strong>
        </div>
        <div>
          <span>STOP</span>
          <strong class="job-stop"></strong>
        </div>
      </div>

      <div class="detail-block items-block">
        <span>ITEMS USED</span>
        <p class="job-items"></p>
      </div>

      <div class="detail-block notes-block">
        <span>NOTES</span>
        <p class="job-notes"></p>
      </div>

      <div class="job-photo-strip photo-strip"></div>

      <div class="job-actions">
        <label class="secondary-button small">
          Add Photos
          <input class="job-photo-input" type="file" accept="image/*" multiple hidden />
        </label>
        <button class="secondary-button small pdf-button">PDF</button>
        <button class="danger-button small delete-button">Delete</button>
      </div>
    </article>
  </template>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
